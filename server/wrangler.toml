# Prometheus cloud sync server. Replace every REPLACE_WITH_... value before deploying.
#
# Secrets are NOT set here. Set them with the Wrangler CLI, never commit them:
#   npx wrangler secret put JWT_SECRET
#   npx wrangler secret put EMAIL_API_KEY    # Resend only
# For local development, put them in .dev.vars (copy .dev.vars.example; it is gitignored).

name = "prometheus-sync"
main = "src/index.ts"
compatibility_date = "2026-08-01"
# account_id = "REPLACE_WITH_CLOUDFLARE_ACCOUNT_ID"

# Only needed for EMAIL_PROVIDER = "cloudflare" (Cloudflare Email Sending; no API key).
# The sender domain in EMAIL_FROM must be onboarded to Email Sending first.
# [[send_email]]
# name = "EMAIL"

[[durable_objects.bindings]]
name = "AUTH"
class_name = "Auth"

[[durable_objects.bindings]]
name = "WORKSPACE"
class_name = "Workspace"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Auth", "Workspace"]

[vars]
# The only account allowed to sign in. Everyone else gets the same replies and no email.
OWNER_EMAIL = "you@example.com"
# Public base URL of this Worker. Sign-in links point here.
PUBLIC_URL = "https://prometheus-sync.REPLACE_WITH_SUBDOMAIN.workers.dev"
# "resend", or "cloudflare" (Cloudflare Email Sending, through the send_email binding below).
# "log" is for local development only: it prints the link and is refused for any non-local PUBLIC_URL.
EMAIL_PROVIDER = "resend"
# Must be a sender on a domain you have verified with the email provider (SPF/DKIM).
EMAIL_FROM = "Prometheus <signin@REPLACE_WITH_VERIFIED_DOMAIN>"
# Optional tuning (defaults shown in src/*.ts):
# LINK_TTL_SECONDS = "900"
# COMPACT_AT = "10000"
# COMPACT_KEEP = "2000"

# Secrets, set with `wrangler secret put` (not in this file):
#   JWT_SECRET      64 random hex characters, signs access tokens
#   EMAIL_API_KEY   API key of the email provider
