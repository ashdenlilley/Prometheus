# Deploys the cloud sync server (server/) to Cloudflare Workers.
# Runs ONLY when started by hand (Actions tab -> Deploy sync server -> Run workflow).
# Run it manually, and only after the repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID exist,
# and after the Worker secrets (JWT_SECRET, EMAIL_API_KEY) were set with `wrangler secret put`.
# See docs/cloud-sync.md ("Deploying").

name: Deploy sync server

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
        working-directory: server

      - run: npm test
        working-directory: server

      - run: npx wrangler deploy
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
