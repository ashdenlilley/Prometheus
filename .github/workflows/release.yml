name: Release

# Builds the macOS DMG and the Windows installer on native runners. Electron packaging must run on
# the target OS (rcedit and NSIS do not run on Apple Silicon; the DMG needs macOS tooling).
#
# Trigger: push a tag like v0.1.0, or run manually from the Actions tab.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            script: dist:mac
            artifacts: 'dist/*.dmg dist/*.dmg.blockmap dist/latest-mac.yml'
          - os: windows-latest
            script: dist:win
            artifacts: 'dist/*.exe dist/*.exe.blockmap dist/latest.yml'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run ${{ matrix.script }}
        env:
          # Unsigned unless these are set. See docs/windows-package.md and docs/macos-package.md.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: prometheus-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
